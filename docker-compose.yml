services:
  website:
    image: ghcr.io/cnotv/generative-art:latest
    environment:
      NODE_ENV: production
    ports:
      - 3000:3000

  # Built on the host from the sources deployed alongside this file — no registry involved.
  multiplayer-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: generative-art-multiplayer-server:latest
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - 3001:3001
    restart: unless-stopped
