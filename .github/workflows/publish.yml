name: Release

on:
  push:
    branches: [main]

# Two releases running at once would race on the version commit and the npm publish.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The last gate before npm. Everything published here is verified as an installed
      # tarball first, because a broken dist cannot be unpublished, only superseded.
      - name: Verify published package output
        run: pnpm run verify:packages

      # Versions are bumped inside each change's own pull request (`pnpm changeset version`),
      # because Actions may not open pull requests here and the main ruleset refuses direct
      # pushes. So this only publishes: every package whose version is not on npm yet goes
      # out, and anything already there is skipped.
      # verify:packages above already built every dist. Publishing runs in parallel, and each
      # package's prepublishOnly and prepare would rebuild it, emptying a dependency's dist
      # while a dependent type-checks against it, so lifecycle scripts are skipped here.
      - name: Publish
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          NPM_CONFIG_IGNORE_SCRIPTS: true

      - name: Push release tags
        run: git push origin --tags
